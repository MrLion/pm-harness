name: pm
description: "Product management layer — /pm status, discover, analyze, challenge, prd, decide, review"
skills:
  - product-management
instruction: |
  The trailing text after /pm is the SUBCOMMAND, not a question. Dispatch it:

    status                    → the /pm status procedure
    discover [query]          → the /pm discover procedure
    analyze <ID>              → the /pm analyze procedure
    challenge <ID>            → the /pm challenge procedure
    prd <ID>                  → the /pm prd procedure
    decide <question>         → the /pm decide procedure
    review                    → the /pm review procedure
    (empty, or unknown word)  → run `status`, then list the available subcommands.

  Vault root: <absolute path to the vault root>
  Read 99-Playbook/Rules.md before doing anything else; it outranks this instruction.
  Never fabricate evidence, metrics, quotes, or product facts — write "Evidence unavailable."